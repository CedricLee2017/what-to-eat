name = "what-to-eat-game"
main = "src/index.js"
compatibility_date = "2026-10-25"

# 靜態遊戲檔案。index.wasm 原始檔超過 Cloudflare 單檔 25 MiB 限制，
# 所以 public 入面只放 gzip 版本（_wasm/index.wasm.gz），由 Worker 回傳時加上
# Content-Encoding: gzip，瀏覽器會自動解壓。
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/index.wasm"]
